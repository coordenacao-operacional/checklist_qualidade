<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checklist Geral de Auditoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: prancheta de auditoria — cabeçalho fixo com nota ao vivo, abas por relatório, cartões de seção empilhados (mobile primeiro) */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --fg:#17201d; --muted:#5b6762; --line:#d5dcd8;
  --accent:#0d5c55; --accent-ink:#ffffff; --accent-soft:#d8ebe8;
  --ok:#1f7a3f; --ok-soft:#dcf0e2; --bad:#b3261e; --bad-soft:#f8dedb; --warn:#9a6200; --warn-soft:#fbecc8; --na:#5b6762; --na-soft:#e4e8e6;
  --gold:#a8790f;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201d; --sunk:#202a26; --fg:#e6ece9; --muted:#9aa8a2; --line:#2e3a35;
  --accent:#5cc2b6; --accent-ink:#06201d; --accent-soft:#183a36;
  --ok:#6fd08f; --ok-soft:#173523; --bad:#ff8a80; --bad-soft:#3d1b19; --warn:#f2bf55; --warn-soft:#3a2d10; --na:#a6b1ac; --na-soft:#26302c; --gold:#e3b24a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201d; --sunk:#202a26; --fg:#e6ece9; --muted:#9aa8a2; --line:#2e3a35;
  --accent:#5cc2b6; --accent-ink:#06201d; --accent-soft:#183a36;
  --ok:#6fd08f; --ok-soft:#173523; --bad:#ff8a80; --bad-soft:#3d1b19; --warn:#f2bf55; --warn-soft:#3a2d10; --na:#a6b1ac; --na-soft:#26302c; --gold:#e3b24a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 96px}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:820px;margin:0 auto}
.brand{min-width:0}
.brand small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-size:19px}
.score{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.score b{font-family:var(--f-mono);font-size:17px}
.score span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;max-width:820px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:9px 12px;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .pill{font-family:var(--f-mono);font-size:11px;margin-left:6px;color:var(--muted)}
.progress{height:3px;background:var(--sunk);margin-inline:-16px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
input[type=text],input[type=month],textarea,select{font:15px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;text-transform:none;letter-spacing:0}
textarea{resize:vertical;min-height:44px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
section.stack{display:flex;flex-direction:column;gap:14px;margin-top:16px}

/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec-h{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border:0;background:none;width:100%;text-align:left;color:var(--fg)}
.sec-h h3{font-size:15px;letter-spacing:.02em;min-width:0}
.sec-h .meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sec-h .cnt{font-size:12px;color:var(--muted)}
.chev{transition:transform .2s;color:var(--muted)}
.sec[data-open="false"] .chev{transform:rotate(-90deg)}
.sec[data-open="false"] .qs{display:none}
.rule{font-size:12.5px;color:var(--gold);padding:0 16px 10px;display:flex;gap:6px;align-items:flex-start}
.badge{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:999px;font-weight:500}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-na{background:var(--na-soft);color:var(--na)}
.q{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.q[data-v="0"]{box-shadow:inset 3px 0 0 var(--bad)}
.prev{font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:7px;background:var(--warn-soft);color:var(--warn)}
.prev.alert{background:var(--bad);color:#fff;font-weight:600}
.reinc{border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--fg);margin-top:12px}
.reinc.err{background:var(--sunk);color:var(--muted)}
.reinc strong{color:var(--warn)}
.reinc .lst{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.reinc .lst button{text-align:left;border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:12.5px}
.reinc .now{margin-top:6px;color:var(--bad);font-weight:700}
.q[data-v="1"]{box-shadow:inset 3px 0 0 var(--ok)}
.q[data-v="na"]{box-shadow:inset 3px 0 0 var(--na)}
.qt{display:flex;gap:10px}
.qn{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px;min-width:22px}
.qt p{margin:0;min-width:0}
.gold{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px}
.ans button{border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px 6px;font-weight:600;font-size:14px;line-height:1.2}
.ans button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.ans button[aria-pressed="true"][data-v="1"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.ans button[aria-pressed="true"][data-v="0"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ans button[aria-pressed="true"][data-v="na"]{background:var(--na-soft);border-color:var(--na);color:var(--na)}
.ans button[aria-pressed="true"] small{color:inherit}
.extra{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.extra textarea{flex:1 1 100%;min-height:42px;font-size:14px}
.photo-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);background:none;color:var(--muted);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;position:relative}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}

/* summary */
.sumhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{padding:18px}
.big .lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.big .val{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1.1;margin-top:4px}
.big .st{margin-top:6px}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res td,table.res th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.res th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.res td.r,table.res th.r{text-align:right}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}
.tw{overflow-x:auto}
.pend{font-size:13px;color:var(--warn);margin:8px 0 0}
.pend button{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font-size:13px}

.member{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.member .sig{grid-column:1/-1}
.sigpad{width:100%;height:120px;border:1px dashed var(--line);border-radius:8px;background:var(--surface);touch-action:none;display:block}
.sigrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:13px}
.danger{color:var(--bad)}
@media (max-width:520px){.member{grid-template-columns:1fr}}

.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec2{background:var(--surface);color:var(--fg);border:1.5px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted)}
.msg{padding:12px 14px;border-radius:8px;font-size:14px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.err{background:var(--bad-soft);color:var(--bad)}.msg.info{background:var(--accent-soft);color:var(--fg)}

/* history */
.hist{display:flex;flex-direction:column;gap:10px}
.hi{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.hi h3{font-size:16px}
.hi .sub{font-size:13px;color:var(--muted)}
.hi .scores{display:flex;gap:6px;flex-wrap:wrap}
.hi .acts{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty h3{color:var(--fg);font-size:18px;margin-bottom:6px}

.fab{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:15}
.fab .wrap{display:flex;gap:10px;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="top">
  <div class="top-row">
    <div class="brand"><small>NutriSaúde · FOR SGQ 22</small><h1>Checklist Geral de Auditoria</h1></div>
    <div class="score" title="Resultado parcial de Boas Práticas"><b id="topScore" class="num">—</b><span>BP</span></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="bp" aria-selected="true">Boas Práticas<span class="pill" id="pill-bp"></span></button>
    <button class="tab" role="tab" data-tab="ef" aria-selected="false">Estrutura Física<span class="pill" id="pill-ef"></span></button>
    <button class="tab" role="tab" data-tab="res" aria-selected="false">Resultado e envio</button>
  </div>
  <div class="progress"><i id="prog"></i></div>
</div>

<main class="wrap">
  <section class="stack" id="identCard">
    <div class="card">
      <div class="grid">
        <label class="f">Unidade<input type="text" id="f-unidade" list="units" autocomplete="off" placeholder="Ex.: BTG 8"></label>
        <label class="f">Gestor(a) da unidade<input type="text" id="f-gestor" autocomplete="off"></label>
        <label class="f">Mês/ano<input type="month" id="f-mes"></label>
        <label class="f">Auditor(a)<input type="text" id="f-auditor" autocomplete="off" placeholder="Quem está aplicando"></label>
      </div>
      <div id="reincBox" class="reinc" hidden aria-live="polite"></div>
      <datalist id="units"><option value="BTG 8"><option value="BTG 1"><option value="HWASHIN"><option value="Ribeirão"><option value="Reckitt"></datalist>
      <div class="legend">
        <span><i class="dot" style="background:var(--ok)"></i>1 = Conforme</span>
        <span><i class="dot" style="background:var(--bad)"></i>0 = Não conforme</span>
        <span><i class="dot" style="background:var(--na)"></i>N/A = Não aplicável</span>
        <span><span class="gold" style="margin:0">Regra de ouro</span> se não conforme, zera a seção</span>
      </div>
    </div>
  </section>

  <section class="stack" id="view-bp"></section>
  <section class="stack" id="view-ef" hidden></section>
  <section class="stack" id="view-res" hidden></section>
</main>

<div class="fab" id="fab"><div class="wrap">
  <span class="note" id="fabNote"></span>
  <button class="btn" id="fabBtn">Próximo</button>
</div></div>
<div class="toast" id="toast" hidden></div>
<iframe name="hiddenSendFrame" id="hiddenSendFrame" title="envio" style="display:none"></iframe>
<form id="pdfSendForm" method="POST" target="hiddenSendFrame" style="display:none">
  <input type="hidden" name="unidade"><input type="hidden" name="gestor"><input type="hidden" name="mes"><input type="hidden" name="auditor">
  <input type="hidden" name="resultadoBP"><input type="hidden" name="resultadoEF"><input type="hidden" name="resumo"><input type="hidden" name="obsGeral"><input type="hidden" name="dados"><input type="hidden" name="ncs"><input type="hidden" name="reincidencias"><input type="hidden" name="fotosNC">
  <input type="hidden" name="filename"><input type="hidden" name="pdfBase64">
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const DATA = [{"k": "bp", "code": "FOR SGQ 22 05", "plus": 1, "s": [{"t": "ARMAZENAMENTO EM TEMPERATURA AMBIENTE (ESTOQUE)", "q": ["Os produtos estão armazenados sobre paletes, prateleiras e/ ou estrados e respeitando as distâncias necessárias do forro, das paredes e do piso?", "Os produtos estão com as embalagens integras? (não estão furadas, amasadas ou estufadas)", "Produtos abertos estão armazenados evitando o risco de contaminação com as embalagens vedadas?", "Produtos abertos estão com as etiquetas preenchidas corretamente e completamente? As informações do fabricante estão sendo respeitadas?", "Produtos improprios para o consumo estão devidamente identificados e separados de outros produtos?", "Não há produtos com data de validade vencida? (produtos abertos a mais de um mês e produtos sem identificação são considerados com data de validade vencida). Obs.: Produto químicos/ limpeza também serão considerados na avaliação.", "O sistema semáforo/ PVPS está sendo aplicado com eficácia? O adesivo está visível a todos?", "Caixas de madeira ou papelão estão devidamente protegidas por saco plástico?", "Os gêneros estão armazenados no estoque de acordo com suas características e recomendações do fabricante?"], "gold": [6]}, {"t": "ARMAZENAMENTO EM TEMPERATURA CONTROLADA (FREEZE/GELADEIRA)", "q": ["Alimentos pré-preparados (carnes temperadas, sobremesas, saladas) são armazenados corretamente evitando contaminações?", "Alimentos pré-preparados (carnes temperadas, sobremesas, saladas) estão identificados? Etiquetas preenchidas corretamente e completamente? (situação válida também para produtos em descongelamento).", "Produtos abertos estão armazenados evitando o risco de contaminação? (embalagens vedadas)", "Produtos abertos estão com as etiquetas preenchidas corretamente e completamente? As informações do fabricante estão sendo respeitadas?", "Não há produtos com data de validade vencida? Produtos abertos a mais de um mês e sem identificação são considerados com data de PARTS.bp.name="Boas Práticas"; PARTS.bp.title="Relatório Técnico de Boas Práticas";
PARTS.ef.name="Estrutura Física"; PARTS.ef.title="Relatório de Estrutura Física";
const DRAFT_KEY="ckga-draft-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.toLowerCase().replace(/(^|[\s\/(-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/ (E|De|Da|Do|Dos|Das|Em|Para) /g,w=>w.toLowerCase());

// ---------- state ----------
let S = blank();
function blank(){return {ident:{unidade:"",gestor:"",mes:new Date().toISOString().slice(0,7),auditor:""},ans:{},obs:{},fotos:{},comite:[{nome:"",funcao:"",sig:""}],obsGeral:""};}
function qid(p,si,qi){return `${p}-${si}-${qi}`;}
try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(d&&d.ans) S=Object.assign(blank(),d);}catch(e){}
let saveT; function saveDraft(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify(S));}catch(e){try{const t=Object.assign({},S,{fotos:{}});localStorage.setItem(DRAFT_KEY,JSON.stringify(t));}catch(_){}}},400);}

// ---------- scoring (mesmas fórmulas da planilha) ----------
function scoreSection(p,si,ans=S.ans){
  const sec=PARTS[p].s[si]; let C=0,D=0,answered=0;
  sec.q.forEach((_,qi)=>{const v=ans[qid(p,si,qi)]; if(v!==undefined)answered++; if(v===0||v===1){C++;D+=v;}});
  let zeroed=null;
  if(sec.gold){for(const g of sec.gold){if(ans[qid(p,si,g-1)]===0){zeroed=`Regra de ouro: item ${g} não conforme`;break;}}}
  if(sec.min && C>0 && D<sec.min){zeroed=`Mínimo de ${sec.min} itens conformes não atingido`;}
  if(zeroed)D=0;
  return {C,D,pct:C?D/C:null,answered,total:sec.q.length,zeroed};
}
function scorePart(p,ans=S.ans){
  let C=0,D=0,answered=0,total=0; const secs=PARTS[p].s.map((_,si)=>{const r=scoreSection(p,si,ans);C+=r.C;D+=r.D;answered+=r.answered;total+=r.total;return r;});
  const plus=PARTS[p].plus; const pct=C?(D+plus)/(C+plus):null;
  return {secs,C,D,pct,answered,total};
}
function band(pct){if(pct==null)return{cls:"b-na",lab:"Sem avaliação",col:"var(--na)"}; if(pct<0.5)return{cls:"b-bad",lab:"Inaceitável",col:"var(--bad)"}; if(pct<0.85)return{cls:"b-warn",lab:"Pode gerar riscos",col:"var(--warn)"}; return{cls:"b-ok",lab:"Dentro da meta",col:"var(--ok)"};}
const fmtPct=p=>p==null?"—":(p*100).toFixed(1).replace(".",",")+"%";

// ---------- render checklist ----------
const openState={};
function renderPart(p){
  const el=$("#view-"+p); const part=PARTS[p];
  el.innerHTML=`<div class="card" style="padding:12px 16px"><h2 style="font-size:17px">${esc(part.title)}</h2><div class="note">${esc(part.code)} · ${part.s.length} seções · ${part.s.reduce((a,s)=>a+s.q.length,0)} itens</div></div>`+
  part.s.map((sec,si)=>{
    const key=p+si; const open=openState[key]??(si===0);
    const rule=sec.gold?`<div class="rule">★ Regra de ouro: ${sec.gold.length>1?"itens":"item"} ${sec.gold.join(", ")} — se não conforme, a seção vale 0.</div>`:sec.min?`<div class="rule">★ A seção só pontua com pelo menos ${sec.min} itens conformes.</div>`:"";
    return `<div class="sec" data-open="${open}" id="sec-${key}">
      <button class="sec-h" data-toggle="${key}" aria-expanded="${open}"><h3>${esc(cap(sec.t))}</h3><span class="meta"><span class="cnt num" id="cnt-${key}"></span><span class="badge" id="bdg-${key}"></span><svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button>
      <div class="qs">${rule}${sec.q.map((q,qi)=>{const id=qid(p,si,qi);const isG=sec.gold&&sec.gold.includes(qi+1);return `
        <div class="q" id="q-${id}" data-v="${S.ans[id]===undefined?"":S.ans[id]}">
          <div class="qt"><span class="qn">${qi+1}.</span><p>${esc(q)}${isG?'<span class="gold">Regra de ouro</span>':""}</p></div>
          <div class="prev" id="prev-${id}" hidden></div>
          <div class="ans" role="group" aria-label="Avaliação do item ${qi+1}">
            ${[[1,"1","Conforme"],[0,"0","Não conforme"],["na","N/A","Não se aplica"]].map(([v,l,s])=>`<button data-q="${id}" data-v="${v}" aria-pressed="${S.ans[id]===v}">${l}<small>${s}</small></button>`).join("")}
          </div>
          <div class="extra">
            <textarea id="obs-${id}" data-obs="${id}" rows="1" placeholder="Observação">${esc(S.obs[id]||"")}</textarea>
            <span class="photo-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Câmera<input type="file" accept="image/*" capture="environment" data-foto="${id}" aria-label="Tirar foto para o item ${qi+1}"></span>
            <span class="photo-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Galeria<input type="file" accept="image/*" multiple data-foto="${id}" aria-label="Escolher fotos da galeria para o item ${qi+1}"></span>
          </div>
          <div class="thumbs" id="th-${id}">${thumbs(id)}</div>
        </div>`;}).join("")}</div></div>`;
  }).join("");
  part.s.forEach((_,si)=>updSec(p,si));
  if(typeof R!=="undefined"&&R&&R.itens)Object.keys(R.itens).forEach(id=>{if(id.startsWith(p+"-"))updPrev(id);});
}
function thumbs(id){return (S.fotos[id]||[]).map((src,i)=>`<div class="thumb"><img src="${src}" alt="Foto ${i+1}"><button data-delfoto="${id}" data-i="${i}" aria-label="Remover foto">×</button></div>`).join("");}
function updSec(p,si){
  const r=scoreSection(p,si),key=p+si,b=band(r.C?r.pct:null);
  const c=$("#cnt-"+key); if(c)c.textContent=`${r.answered}/${r.total}`;
  const bd=$("#bdg-"+key); if(bd){bd.className="badge "+(r.answered?b.cls:"b-na");bd.textContent=r.C?fmtPct(r.pct):"—";}
}
function updTop(){
  const bp=scorePart("bp"),ef=scorePart("ef");
  $("#topScore").textContent=fmtPct(bp.pct);
  $("#pill-bp").textContent=`${bp.answered}/${bp.total}`;$("#pill-ef").textContent=`${ef.answered}/${ef.total}`;
  $("#prog").style.width=((bp.answered+ef.answered)/(bp.total+ef.total)*100)+"%";
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.q){const id=t.dataset.q;let v=t.dataset.v;v=v==="na"?"na":+v;

    const q=$("#q-"+id);q.dataset.v=S.ans[id]===undefined?"":S.ans[id];
    q.querySelectorAll(".ans button").forEach(b=>{const bv=b.dataset.v==="na"?"na":+b.dataset.v;b.setAttribute("aria-pressed",S.ans[id]===bv);});

function compress(file,max=1100,q=0.62){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

function setupSig(cv){
  const i=+cv.dataset.sig,r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";
  if(S.comite[i].sig){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=S.comite[i].sig;}
  let drawing=false,last;
  const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
  cv.onpointerdown=e=>{drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;};
  cv.onpointerup=cv.onpointercancel=()=>{if(!drawing)return;drawing=false;
    const o=document.createElement("canvas");o.width=r.width*dpr;o.height=r.height*dpr;const oc=o.getContext("2d");oc.fillStyle="#fff";oc.fillRect(0,0,o.width,o.height);oc.drawImage(cv,0,0);
    S.comite[i].sig=o.toDataURL("image/jpeg",0.8);saveDraft();};
}

function buildPdf(A){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"}); const W=210,M=14;
  const [y,m]=(A.ident.mes||"").split("-"); const mesTxt=m?`${m}/${y}`:"";
  const BR=[13,92,85];
  const head=(t,code)=>{doc.setFillColor(...BR);doc.rect(0,0,W,24,"F");doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text("CHECKLIST GERAL DE AUDITORIA",M,11);doc.setFontSize(10);doc.setFont("helvetica","normal");doc.text(`${t} · ${code}`,M,18);doc.setTextColor(20);
    doc.setFontSize(9.5);doc.text(`Unidade: ${A.ident.unidade||"-"}    Gestor(a): ${A.ident.gestor||"-"}    Mês/ano: ${mesTxt}    Auditor(a): ${A.ident.auditor||"-"}`,M,31);return 36;};
  const col=p=>p==null?[110,110,110]:p<.5?[179,38,30]:p<.85?[154,98,0]:[31,122,63];
  let first=true;
  for(const p of ["bp","ef"]){
    if(!first)doc.addPage(); first=false;
    const part=PARTS[p], R=scorePart(p,A.ans); let yy=head(part.title.toUpperCase(),part.code);
    const b=band(R.pct); doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(...col(R.pct));doc.text(`Resultado final: ${fmtPct(R.pct)} - ${b.lab}`,M,yy+2);doc.setTextColor(20);yy+=6;
    const nRe=Object.keys(A.reinc||{}).filter(id=>id.startsWith(p+"-")).length;
    if(nRe){doc.setFontSize(10);doc.setTextColor(179,38,30);doc.text(`Reincidências: ${nRe} ${nRe>1?"itens não conformes já apontados":"item não conforme já apontado"} em auditorias anteriores (destacados em vermelho)`,M,yy+1);doc.setTextColor(20);yy+=6;}
    doc.autoTable({startY:yy,head:[["Seção","Conf./Aval.","%"]],body:part.s.map((s,si)=>{const r=R.secs[si];return [cap(s.t)+(r.zeroed?`\n(${r.zeroed})`:""),`${r.D}/${r.C}`,fmtPct(r.pct)];}),
      styles:{fontSize:8.5,cellPadding:1.8},headStyles:{fillColor:BR},columnStyles:{1:{halign:"right",cellWidth:24},2:{halign:"right",cellWidth:20}},margin:{left:M,right:M},
      didParseCell:d=>{if(d.section==="body"&&d.column.index===2){d.cell.styles.textColor=col(R.secs[d.row.index].pct);d.cell.styles.fontStyle="bold";}}});
    for(const [si,s] of part.s.entries()){
      const r=R.secs[si]; const body=[], photoRows={}, reincRows={};
      const GAP=4, PW=(W-2*M-4-GAP)/2, PHMAX=72;
      s.q.forEach((q,qi)=>{const id=qid(p,si,qi),v=A.ans[id];const g=s.gold&&s.gold.includes(qi+1)?" [Regra de ouro]":"";
        const rc=A.reinc&&A.reinc[id]; if(rc)reincRows[body.length]=1;
        body.push([`${qi+1}. ${q}${g}`+(rc?`\nREINCIDÊNCIA - também não conforme em ${rc.join(", ")}`:""),v===undefined?"-":v==="na"?"N/A":String(v),A.obs[id]||""]);
        const fs=(A.fotos[id]||[]).filter(Boolean);
        for(let k=0;k<fs.length;k+=2){const pair=fs.slice(k,k+2).map(src=>{let pr;try{pr=doc.getImageProperties(src);}catch(e){return null;}const sc=Math.min(PW/pr.width,PHMAX/pr.height);return {src,w:pr.width*sc,h:pr.height*sc};}).filter(Boolean);
          if(!pair.length)continue; const h=Math.max(...pair.map(x=>x.h));
          photoRows[body.length]=pair; body.push([{content:"",colSpan:3,styles:{minCellHeight:h+4,cellPadding:2}}]);}
      });
      doc.autoTable({startY:doc.lastAutoTable.finalY+6,head:[[{content:`${cap(s.t)} - ${fmtPct(r.pct)}`,colSpan:3}],["Item","Aval.","Observação"]],body,rowPageBreak:"avoid",
        styles:{fontSize:7.8,cellPadding:1.6,valign:"top"},headStyles:{fillColor:BR},columnStyles:{0:{cellWidth:112},1:{halign:"center",cellWidth:14,fontStyle:"bold"}},margin:{left:M,right:M},
        didParseCell:d=>{if(d.section==="body"&&reincRows[d.row.index]){d.cell.styles.fillColor=[252,228,226];if(d.column.index===0)d.cell.styles.textColor=[150,30,24];}
          if(d.section==="body"&&d.column.index===1&&!photoRows[d.row.index]){const t=d.cell.raw;d.cell.styles.textColor=t==="0"?[179,38,30]:t==="1"?[31,122,63]:[110,110,110];}},
        didDrawCell:d=>{if(d.section!=="body"||d.column.index!==0)return;const pair=photoRows[d.row.index];if(!pair)return;
          let x=d.cell.x+2;for(const im of pair){try{doc.addImage(im.src,"JPEG",x,d.cell.y+2,im.w,im.h);}catch(e){}x+=PW+GAP;}}});
    }
  }
  // resumo + assinaturas
  doc.addPage();let yy=head("CONCLUSÃO","");

  yy=doc.lastAutoTable.finalY+6;doc.setFontSize(8.5);doc.setTextColor(90);doc.text("Inaceitável: 0% até 49,99%   ·   Pode gerar riscos: 50% até 84,99%   ·   Dentro da meta: 85% até 100%",M,yy);doc.setTextColor(20);yy+=8;

    if(mb.sig){try{doc.addImage(mb.sig,"JPEG",M,yy,60,20);}catch(e){}}
    doc.line(M,yy+21,M+80,yy+21);doc.setFontSize(9);doc.text(`${mb.nome||""}${mb.funcao?" - "+mb.funcao:""}`,M,yy+25.5);yy+=32;}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(120);doc.text(`NutriSaúde · Checklist Geral de Auditoria · página ${i}/${n}`,M,292);}

  return {doc,fname};
}

  const box=$("#reincBox");
  if(!R){box.hidden=true;return;}
  box.hidden=false;box.className="reinc";
  if(R.erro){box.className="reinc err";box.textContent="Não foi possível consultar as auditorias anteriores agora. O checklist funciona normalmente, mas sem o aviso de reincidência.";return;}
  if(!R.auditorias){box.className="reinc err";box.textContent=`Nenhuma auditoria anterior de ${R.unidade} registrada no checklist online. Os avisos de reincidência começam a partir da próxima visita.`;return;}
  const ids=Object.keys(R.itens);
  if(!ids.length){box.className="reinc err";box.textContent=`Última auditoria nesta unidade: ${R.ultima.data}${R.ultima.auditor?" ("+R.ultima.auditor+")":""}. Não havia itens não conformes.`;return;}
  const now=reincAtuais();
  box.innerHTML=`<strong>Histórico da unidade:</strong> última auditoria em ${esc(R.ultima.data)}${R.ultima.auditor?" ("+esc(R.ultima.auditor)+")":""}. ${ids.length} ${ids.length>1?"itens já foram apontados":"item já foi apontado"} como não conforme e ${ids.length>1?"estão sinalizados":"está sinalizado"} em amarelo. Se marcar 0 de novo, aparece o alerta de reincidência.
    <div class="lst">${ids.map(id=>{const r=itemRef(id);return `<button data-gotoq="${id}">${esc(r.bloco)} · item ${r.n}</button>`;}).join("")}</div>
    ${now.length?`<div class="now">⚠ ${now.length} reincidência${now.length>1?"s":""} marcada${now.length>1?"s":""} nesta auditoria.</div>`:""}`;
}
function applyReinc(){document.querySelectorAll(".prev").forEach(el=>el.hidden=true);if(R&&R.itens)Object.keys(R.itens).forEach(updPrev);updReincBox();}
function consultaReinc(){
  const u=(S.ident.unidade||"").trim();
  if(!APPS_SCRIPT_URL||u.length<2){R=null;reincU=null;applyReinc();return;}
  if(reincU===u.toLowerCase())return; reincU=u.toLowerCase();
  const box=$("#reincBox");box.hidden=false;box.className="reinc err";box.textContent=`Consultando auditorias anteriores de ${u}…`;
  fetch(APPS_SCRIPT_URL+"?reincidencia="+encodeURIComponent(u)).then(r=>r.json()).then(d=>{
    if((S.ident.unidade||"").trim().toLowerCase()!==u.toLowerCase())return;
    consultaReinc.tentou=false;R=d&&d.itens?d:{erro:true};applyReinc();
  }).catch(()=>{
    if(!consultaReinc.tentou){consultaReinc.tentou=true;reincU=null;setTimeout(consultaReinc,2500);return;}
    consultaReinc.tentou=false;R={erro:true};reincU=null;applyReinc();});
}

// ---------- boot ----------
function fillIdent(){for(const k of ["unidade","gestor","mes","auditor"])$("#f-"+k).value=S.ident[k]||"";}
fillIdent();renderPart("bp");renderPart("ef");updTop();go("bp");consultaReinc();
</script>
